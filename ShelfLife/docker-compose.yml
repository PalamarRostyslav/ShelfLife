services:  
  catalog.api:
    build:
      context: .
      dockerfile: ShelfLife.Catalog.Api/Dockerfile
    ports:
      - "5103:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__CatalogDb=Host=catalog.db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      - catalog.db

  catalog.db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - catalog_db_data:/var/lib/postgresql/data

  gateway:
    build:
      context: .
      dockerfile: ShelfLife.Gateway/Dockerfile
    container_name: shelflife-gateway
    depends_on:
      - catalog.api
    environment:
      Services__Catalog: "http://catalog.api:8080/"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5100:8080"

volumes:
  catalog_db_data:
